<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta
      name="theme-color"
      content="#facc15"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#93c5fd"
      media="(prefers-color-scheme: light)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <!-- hooks.server.ts fills these in per request (see src/lib/theme.ts). They
       are declared here, valueless, so the substitution has one unambiguous
       target: matching a bare "<body" would instead hit the first such text
       anywhere in the document, including inside inlined CSS in <head>. -->
  <body data-group data-theme>
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
