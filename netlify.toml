# example netlify.toml
[build]
  command = "npm run build"
  publish = "build"

[functions]
  directory = "functions"
  node_bundler = "esbuild"
  external_node_modules = ["mdsvex", "@resvg/resvg-js"]
  # adapter-netlify's read() from $app/server reads fonts via a runtime path
  # string that esbuild can't trace, so the OG image's .ttf assets never get
  # zipped into the Lambda -> ENOENT -> 500. Force them into the bundle.
  included_files = [".netlify/server/**/*.ttf"]

[build.environment]
  NODE_VERSION = "22"

# Deploy previews only: lets /about answer with fixed activity payloads when a
# request carries the x-activity-fixtures header, so the Playwright a11y scan
# doesn't hang on last.fm / Letterboxd / Steam / Duolingo. Scoped to this
# context, so production never sets it and the guard there fails closed.
# See src/routes/(main)/about/+page.server.ts.
[context.deploy-preview.environment]
  ALLOW_ACTIVITY_FIXTURES = "true"

# Image CDN allowlist. Post and gallery images are GitHub issue attachments, so
# /.netlify/images has to be told these hosts are ours to proxy — anything not
# matched here comes back 400. See src/lib/image.ts.
[images]
  remote_images = [
    "https://github\\.com/user-attachments/assets/.*",
    "https://.*\\.githubusercontent\\.com/.*"
  ]

[[headers]]
  ## https://answers.netlify.com/t/content-type-header-not-working-in-netlify-toml/7718
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "public, max-age=4000"
    # cache just over 1 hour for webpagetest to be happy
    X-Content-Type-Options = "nosniff"
    ## Content-Security-Policy = "default-src 'self'; script-src 'nonce-swyx'; img-src *"
