name: Playwright Tests

on: [pull_request]

env:
  GITHUB_PR_NUMBER: ${{github.event.pull_request.number}}

jobs:
  prepare:
    name: Wait for Netlify deployment
    runs-on: ubuntu-latest
    steps:
      - name: Waiting for Netlify Preview
        uses: jakepartusch/wait-for-netlify-action@v1.4
        id: wait-for-netlify-preview
        with:
          site_name: 'heffner'
          max_timeout: 180

  test:
    needs: prepare
    name: Run tests against PR environment
    runs-on: ubuntu-latest
    # The suite runs serially-ish against a deployed preview, so every
    # navigation is a network round trip plus a possible function cold start.
    # 5 minutes had no headroom over `npm ci` + the browser install and the job
    # was being cancelled mid-run.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches netlify.toml / ci.yml
          cache: npm
      - name: install dependencies
        run: npm ci

      # Browser binaries are the biggest fixed cost in this job. They're
      # version-locked, so key the cache on the resolved Playwright version and
      # it only re-downloads on an upgrade.
      - name: cache playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # `--with-deps` does two things: download browsers (into the cached dir)
      # and apt-install system libraries (into system paths, which the cache
      # can't hold). On a hit we still need the apt half or webkit won't launch.
      - name: install playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: install playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - name: run tests
        run: npm run test
        env:
          PLAYWRIGHT_TEST_BASE_URL: 'https://deploy-preview-${{env.GITHUB_PR_NUMBER}}--heffner.netlify.app/'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
