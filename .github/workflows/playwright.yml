name: Playwright Tests

on: [pull_request]

jobs:
  test:
    name: Run tests against PR environment
    runs-on: ubuntu-latest
    # The suite runs serially-ish against a deployed preview, so every
    # navigation is a network round trip plus a possible function cold start.
    # On top of that the job can spend up to 7m30s waiting on Workers Builds,
    # so leave the whole thing plenty of room rather than cancelling mid-run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Workers Builds uploads a preview version per non-production branch and
      # aliases it to the branch name, lowercased with everything outside
      # [a-z0-9] collapsed to a dash. CF_WORKERS_SUBDOMAIN is a repo variable —
      # the account's workers.dev subdomain, which isn't derivable from here.
      - name: Resolve preview URL
        id: preview
        run: |
          alias=$(echo "${{ github.head_ref }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//' \
            | cut -c1-63)
          echo "url=https://${alias}-heffdotdev.${{ vars.CF_WORKERS_SUBDOMAIN }}.workers.dev/" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches ci.yml
          cache: npm
      - name: install dependencies
        run: npm ci

      # Browser binaries are the biggest fixed cost in this job. They're
      # version-locked, so key the cache on the resolved Playwright version and
      # it only re-downloads on an upgrade.
      - name: cache playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # `--with-deps` does two things: download browsers (into the cached dir)
      # and apt-install system libraries (into system paths, which the cache
      # can't hold). On a hit we still need the apt half or webkit won't launch.
      - name: install playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: install playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      # The branch alias keeps serving the previous upload while the new build
      # runs, so "responds 200" says nothing about which commit is up. svelte
      # config stamps WORKERS_CI_COMMIT_SHA into /_app/version.json; wait for
      # that to match the commit this run is testing. Deliberately placed after
      # the setup steps above so the Cloudflare build overlaps with them.
      - name: Wait for Cloudflare preview of this commit
        run: |
          sha='${{ github.event.pull_request.head.sha }}'
          url='${{ steps.preview.outputs.url }}_app/version.json'
          for i in $(seq 1 90); do
            got=$(curl -fsS --max-time 10 "$url" | jq -r '.version' || true)
            if [ "$got" = "$sha" ]; then
              echo "preview is up to date after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "preview never reached $sha within 7m30s (last seen: ${got:-no response})"
          exit 1

      - name: run tests
        run: npm run test
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.preview.outputs.url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
