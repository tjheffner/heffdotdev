name: CI

# Fast, deterministic gate so formatting / type regressions are caught on PRs
# instead of slipping through (the e2e workflow only runs against a deployed
# Cloudflare preview, which also covers the build).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Format & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check + svelte-check
        run: npm run lint
